name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache: true

      - name: Check module files
        run: go mod tidy -diff

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm exec --workspace=@shift/web -- vue-tsc --noEmit -p tsconfig.json

      - name: Build web
        run: npm run build -w @shift/web

      - name: Check mini program sources
        shell: bash
        run: |
          node --check apps/miniprogram/services/api.js
          node --check apps/miniprogram/pages/settings/index.js
          node --check apps/miniprogram/pages/schedule/index.js
          node --check apps/miniprogram/pages/requests/index.js
          node -e "for (const f of ['apps/miniprogram/app.json','apps/miniprogram/project.config.json','apps/miniprogram/sitemap.json','apps/miniprogram/pages/settings/index.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
